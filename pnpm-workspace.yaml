autoInstallPeers: false
pmOnFail: error
# Leave enough path budget for CMake/Ninja in deep Windows worktrees.
virtualStoreDirMaxLength: 40

allowBuilds:
  browser-tabs-lock: false
  core-js: false
  esbuild: true
  tesseract.js: false

patchedDependencies:
  '@expo/metro-config@57.0.12': patches/@expo__metro-config@57.0.12.patch
  '@react-native/gradle-plugin@0.86.3': patches/@react-native__gradle-plugin@0.86.3.patch
  expo-dev-launcher@57.0.20: patches/expo-dev-launcher@57.0.20.patch
  expo-modules-jsi@57.1.0: patches/expo-modules-jsi@57.1.0.patch
  expo-updates@57.0.23: patches/expo-updates@57.0.23.patch
  nativewind@4.2.3: patches/nativewind@4.2.3.patch
  oxc-parser@0.130.0: patches/oxc-parser@0.130.0.patch
  react-native-keyboard-controller@1.21.9: patches/react-native-keyboard-controller@1.21.9.patch

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.10 || 57.0.26'
  - '@expo/config-plugins@57.0.6'
  - '@expo/config@57.0.6'
  - '@expo/fingerprint@0.20.6'
