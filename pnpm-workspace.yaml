autoInstallPeers: false
pmOnFail: error
# Leave enough path budget for CMake/Ninja in deep Windows worktrees.
virtualStoreDirMaxLength: 40

allowBuilds:
  '@parcel/watcher': false
  browser-tabs-lock: false
  core-js: false
  esbuild: true
  tesseract.js: false
  # Jest 30 ships platform prebuilt resolver bindings; no install fallback.
  unrs-resolver: false

patchedDependencies:
  '@expo/metro-config@58.0.14': patches/@expo__metro-config@58.0.14.patch
  '@react-native/gradle-plugin@0.88.0': patches/@react-native__gradle-plugin@0.88.0.patch
  expo-updates@58.0.17: patches/expo-updates@58.0.17.patch
  nativewind@4.2.3: patches/nativewind@4.2.3.patch
  oxc-parser@0.130.0: patches/oxc-parser@0.130.0.patch

minimumReleaseAgeExclude:
  # Stable SDK 58 packages and its compatible Clerk client, audited for DAY-527.
  - '@expo/cli@58.1.11'
  - '@expo/schema-utils@58.0.2'
  - '@expo/ui@58.0.20'
  - babel-preset-expo@58.0.17
  - expo-application@58.1.2
  - expo-crypto@58.0.7
  - expo-dev-client@58.0.14
  - expo-dev-launcher@58.0.14
  - expo-glass-effect@58.0.4
  - expo-haptics@58.0.7
  - expo-modules-core@58.0.22
  - expo-modules-jsi@58.0.15
  - expo-notifications@58.1.5
  - expo-router@58.0.23
  - expo-splash-screen@58.0.10
  - expo@58.0.14
  - '@clerk/clerk-js@6.39.1'
  - '@clerk/expo@4.13.0'
