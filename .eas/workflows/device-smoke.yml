name: Manual device smoke validation

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        options: [android, ios]
      build_id:
        type: string
        required: true
      flow:
        type: choice
        options: [full, authenticated]
        default: full

jobs:
  smoke:
    type: maestro
    environment: development
    runs_on: ${{ inputs.platform == 'android' && 'linux-medium-nested-virtualization' || 'macos-medium' }}
    env:
      MAESTRO_APP_ID: ${{ inputs.platform == 'android' && 'com.dayova.dev' || 'de.dayova.app-dev' }}
    hooks:
      before_maestro_tests:
        - run: node scripts/ci-prepare-maestro.mjs
      after_maestro_tests:
        - if: ${{ always() }}
          run: node scripts/ci-sanitize-maestro.mjs
    params:
      build_id: ${{ inputs.build_id }}
      flow_path: ${{ inputs.flow == 'authenticated' && '.maestro/ci/authenticated.yaml' || '.maestro/ci' }}
      exclude_tags: negative-control
      maestro_version: 2.10.0
      retries: 0
      output_format: junit
