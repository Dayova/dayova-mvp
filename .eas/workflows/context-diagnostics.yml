name: Workflow context diagnostics

on:
  workflow_dispatch: {}

jobs:
  context:
    type: custom
    runs_on: linux-medium
    env:
      CI_EVENT_NAME: ${{ github.event_name || 'missing' }}
      CI_REF_NAME: ${{ github.ref_name || 'missing' }}
      CI_NON_PUSH: ${{ github.event_name != 'push' && 'true' || 'false' }}
      CI_ROUTE: ${{ (github.event_name != 'push' || github.ref_name == 'main' || startsWith(github.ref_name || 'manual', 'gh-readonly-queue/main/')) && 'true' || 'false' }}
    steps:
      - run: node -e 'console.log(JSON.stringify(Object.fromEntries(Object.entries(process.env).filter(([key]) => key.startsWith("CI_")))))'
  route:
    type: doc
    if: ${{ github.event_name != 'push' || github.ref_name == 'main' || startsWith(github.ref_name || 'manual', 'gh-readonly-queue/main/') }}
    params:
      md: The quality branch-routing condition accepted this context.
  manual:
    type: doc
    if: ${{ github.event_name == 'workflow_dispatch' }}
    params:
      md: The event is workflow_dispatch.
