name: Continuous Integration

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
      - gh-readonly-queue/main/**
  workflow_dispatch:
    inputs:
      native_checks:
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.event_name }}-${{ github.ref }}

defaults:
  tools:
    node: '24.18.0'
    pnpm: '11.15.1'

jobs:
  source_gate:
    name: CI source eligibility
    type: doc
    # Keep the repository boundary separate to fit EAS's 250-character conditions.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id) }}
    params:
      md: 'CI source is eligible: pull requests must originate from this repository.'

  contributor_gate:
    name: CI contributor eligibility
    type: doc
    needs:
      - source_gate
    # Separate contributor trust from branch routing to fit EAS's condition limit.
    if: ${{ github.event_name != 'pull_request' || contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association) }}
    params:
      md: 'CI contributor is eligible: pull requests must come from trusted contributors.'

  production_fingerprint:
    name: Production native fingerprints
    type: fingerprint
    environment: production
    # checks supplies the contributor trust gate; production inputs stay off forks.
    needs:
      - quality
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id) }}

  quality:
    name: Quality checks
    type: custom
    runs_on: linux-medium
    needs:
      - contributor_gate
    env:
      CI_EVENT_NAME: ${{ github.event_name }}
      CI_REF_NAME: ${{ github.ref_name }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'unavailable' }}
      CI_NATIVE_FORCE: ${{ inputs.native_checks && 'true' || 'false' }}
      CI_COVERAGE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      CI_JEST_WORKERS: "2"
    outputs:
      native_required: ${{ steps.native_scope.outputs.required }}
    # This custom job uses production scope; fork code must not reach checkout.
    if: ${{ github.event_name != 'push' || github.ref_name == 'main' || startsWith(github.ref_name, 'gh-readonly-queue/main/') }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: native_scope
        name: Determine native validation scope
        run: |
          mkdir -p .maestro/artifacts/ci
          node scripts/ci-native-changes.mjs > .maestro/artifacts/ci/native-scope.json
          cat .maestro/artifacts/ci/native-scope.json
          set-output required "$(node -p 'JSON.parse(require("fs").readFileSync(".maestro/artifacts/ci/native-scope.json", "utf8")).required')"
      - name: Check formatting
        run: pnpm format:check
      - name: Run lint
        run: pnpm lint
      - name: Check unused code and dependencies
        run: pnpm check:unused
      - name: Validate repository skills
        run: pnpm skills:validate
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run tests
        env:
          EAS_BUILD: 'false'
        run: pnpm test:ci
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: quality-test-results
          path: .maestro/artifacts/ci

  ota_checks:
    name: Production OTA gates
    type: custom
    runs_on: linux-medium
    needs:
      - quality
      - production_fingerprint
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id) }}
    environment: production
    env:
      APP_VARIANT: production
      OTA_ANDROID_FINGERPRINT: ${{ needs.production_fingerprint.outputs.android_fingerprint_hash }}
      OTA_IOS_FINGERPRINT: ${{ needs.production_fingerprint.outputs.ios_fingerprint_hash }}
    outputs:
      ota_safe: ${{ steps.ota_guard.outputs.ota_safe }}
      ota_reason: ${{ steps.ota_guard.outputs.ota_reason }}
      ota_baseline: ${{ steps.ota_guard.outputs.ota_baseline }}
      ota_current_fingerprints: ${{ steps.ota_guard.outputs.ota_current_fingerprints }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Export and verify both production platforms
        run: node scripts/production-export.mjs
      - id: ota_guard
        name: Check OTA safety against distributed binaries
        run: |-
          source scripts/ci-ota-report.sh
      - name: Require a completed OTA assessment
        run: test "${{ steps.ota_guard.outputs.ota_failure_kind }}" != "preflight"
      - uses: eas/upload_artifact
        with:
          type: other
          name: production-export
          path: dist/production

  checks:
    # Preserve the required Expo check context; skipped prerequisites must fail.
    name: Lint, typecheck, and test
    type: custom
    environment: production
    runs_on: linux-medium
    after:
      - quality
      - production_fingerprint
      - ota_checks
      - android_smoke
      - ios_smoke
      - authenticated_smoke
    env:
      QUALITY_STATUS: ${{ after.quality.status }}
      FINGERPRINT_STATUS: ${{ after.production_fingerprint.status }}
      OTA_STATUS: ${{ after.ota_checks.status }}
      REQUIRE_OTA: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main')) && 'true' || 'false' }}
      REQUIRE_NATIVE: ${{ after.quality.outputs.native_required || 'false' }}
      ANDROID_STATUS: ${{ after.android_smoke.status }}
      IOS_STATUS: ${{ after.ios_smoke.status }}
      AUTH_STATUS: ${{ after.authenticated_smoke.status }}
      APP_VARIANT: production
      CI_SOURCE_SHA: ${{ github.sha }}
      OTA_IOS_FINGERPRINT: ${{ after.production_fingerprint.outputs.ios_fingerprint_hash || 'unavailable' }}
      OTA_ANDROID_FINGERPRINT: ${{ after.production_fingerprint.outputs.android_fingerprint_hash || 'unavailable' }}
    steps:
      - name: Require successful validation
        run: |
          set -euo pipefail
          test "$QUALITY_STATUS" = success
          if [ "$REQUIRE_OTA" = true ]; then
            test "$FINGERPRINT_STATUS" = success
            test "$OTA_STATUS" = success
          fi
          if [ "$REQUIRE_NATIVE" = true ]; then
            test "$ANDROID_STATUS" = success
            test "$IOS_STATUS" = success
            test "$AUTH_STATUS" = success
          fi
      - uses: eas/checkout
        if: ${{ success() && env.REQUIRE_OTA == 'true' }}
      - uses: eas/download_artifact
        id: verified_export
        if: ${{ success() && env.REQUIRE_OTA == 'true' }}
        with:
          name: production-export
      - name: Verify artifact transfer and provenance
        if: ${{ success() && env.REQUIRE_OTA == 'true' }}
        run: node scripts/ci-verify-export.mjs "${{ steps.verified_export.outputs.artifact_path }}"

  pr_ota_report:
    name: PR OTA compatibility report
    type: doc
    after: &pr_ota_report_dependencies
      - production_fingerprint
      - ota_checks
    if: ${{ github.event_name == 'pull_request' }}
    params:
      md: &pr_ota_report_markdown |
        <!-- dayova-ota-report -->
        ## 📱 OTA compatibility

        **Checked commit:** `${{ github.sha }}` · 🔎 [View EAS run](${{ workflow.url }})

        **This report applies only to the checked commit.** If the PR's latest commit differs, this result is **outdated** and OTA compatibility for the latest commit is **unconfirmed** until this comment updates.

        ### ${{ after.ota_checks.status == 'success' && (after.ota_checks.outputs.ota_safe == 'true' && '✅ OTA-compatible' || after.ota_checks.outputs.ota_safe == 'false' && '⚠️ Not OTA-compatible') || '❓ Compatibility not confirmed' }}


        | Check | Status |
        | --- | --- |
        | 🧬 Native fingerprints | ${{ after.production_fingerprint.status == 'success' && '✅ Completed' || after.production_fingerprint.status == 'failure' && '❌ Failed' || '⏭️ Not completed' }} |
        | 📦 iOS & Android exports + OTA assessment | ${{ after.ota_checks.status == 'success' && '✅ Completed' || after.ota_checks.status == 'failure' && '❌ Failed' || '⏭️ Not completed' }} |

        💡 **Advisory for merging.** Native changes can still merge. Nothing is published by this PR check; main rechecks the merged commit before publishing.

        <details>
        <summary>🛠️ Technical details — reason, builds & fingerprints</summary>

        **Reason:** ${{ after.ota_checks.outputs.ota_reason || 'Assessment did not complete. Production checks run only for trusted, same-repository PRs after quality checks pass.' }}

        **📦 Distributed builds:** `${{ after.ota_checks.outputs.ota_baseline || 'Not assessed' }}`

        **🧬 Current fingerprints**

        | Platform | Fingerprint |
        | --- | --- |
        | iOS | `${{ after.production_fingerprint.outputs.ios_fingerprint_hash || 'Not assessed' }}` |
        | Android | `${{ after.production_fingerprint.outputs.android_fingerprint_hash || 'Not assessed' }}` |

        **📂 Repositories**

        | Source | Target |
        | --- | --- |
        | `${{ github.event.pull_request.head.repo.full_name || 'Unavailable' }}` | `${{ github.event.pull_request.base.repo.full_name || 'Unavailable' }}` |

        </details>

  pr_ota_comment:
    name: Post OTA report to GitHub PR
    type: github-comment
    after: *pr_ota_report_dependencies
    if: ${{ github.event_name == 'pull_request' }}
    params:
      payload: *pr_ota_report_markdown

  deploy_convex:
    name: Deploy Convex
    type: custom
    runs_on: linux-medium
    needs:
      - checks
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Deploy Convex
        run: pnpm convex deploy --typecheck enable

  send_updates:
    name: Send updates
    type: custom
    runs_on: linux-medium
    needs:
      - ota_checks
      - production_fingerprint
      - deploy_convex
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && needs.ota_checks.outputs.ota_safe == 'true' }}
    environment: production
    env:
      APP_VARIANT: production
      OTA_SOURCE_SHA: ${{ github.sha }}
      OTA_ANDROID_FINGERPRINT: ${{ needs.production_fingerprint.outputs.android_fingerprint_hash }}
      OTA_IOS_FINGERPRINT: ${{ needs.production_fingerprint.outputs.ios_fingerprint_hash }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - uses: eas/download_artifact
        id: verified_export
        with:
          name: production-export
      - name: Verify production manifest and distributed-binary compatibility
        run: node scripts/ota-safety.mjs
      - name: Publish the verified production export
        run: |
          export OTA_EXPORT_DIRECTORY="${{ steps.verified_export.outputs.artifact_path }}"
          node scripts/publish-production-ota.mjs

  ota_skipped:
    name: OTA update skipped
    type: doc
    needs:
      - ota_checks
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && needs.ota_checks.outputs.ota_safe != 'true' }}
    params:
      md: |
        ## OTA update skipped

        The production OTA update was not sent.

        **Reason:** ${{ needs.ota_checks.outputs.ota_reason }}

        **Distributed baseline:** ${{ needs.ota_checks.outputs.ota_baseline }}

        **Current fingerprints:** ${{ needs.ota_checks.outputs.ota_current_fingerprints }}

        This block persists across later commits until the production manifest and native fingerprints match verified distributed binaries.
  native_fingerprint:
    name: Test native fingerprints
    type: fingerprint
    environment: development
    needs:
      - quality
    if: ${{ needs.quality.outputs.native_required == 'true' }}
    env:
      APP_VARIANT: preview
      DAYOVA_CI_VALIDATION: 'true'
      EXPO_NO_DOTENV: '1'
  android_get_build:
    name: android matching native artifact
    type: get-build
    needs:
      - native_fingerprint
    params:
      platform: android
      profile: ci
      fingerprint_hash: ${{ needs.native_fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true
  android_build:
    name: android native compile
    type: build
    needs:
      - android_get_build
    if: ${{ !needs.android_get_build.outputs.build_id }}
    params:
      platform: android
      profile: ci
  android_repack:
    name: android current bundle on verified native runtime
    type: repack
    environment: development
    env:
      APP_VARIANT: preview
      DAYOVA_CI_VALIDATION: 'true'
      EXPO_NO_DOTENV: '1'
    needs:
      - android_get_build
    if: ${{ needs.android_get_build.outputs.build_id }}
    params:
      build_id: ${{ needs.android_get_build.outputs.build_id }}
      embed_bundle_assets: true
  android_smoke:
    name: android embedded app smoke
    type: maestro
    environment: development
    after:
      - native_fingerprint
      - android_build
      - android_repack
    if: ${{ after.native_fingerprint.status == 'success' }}
    env:
      MAESTRO_APP_ID: com.dayova.dev
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: ${{ after.android_repack.outputs.build_id || after.android_build.outputs.build_id }}
      flow_path:
        - .maestro/ci/unauthenticated.yaml
        - .maestro/ci/authenticated.yaml
      maestro_version: 2.10.0
      retries: 0
      output_format: junit
  ios_get_build:
    name: ios matching native artifact
    type: get-build
    needs:
      - native_fingerprint
    params:
      platform: ios
      profile: ci
      fingerprint_hash: ${{ needs.native_fingerprint.outputs.ios_fingerprint_hash }}
      simulator: true
      wait_for_in_progress: true
  ios_build:
    name: ios native compile
    type: build
    needs:
      - ios_get_build
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    params:
      platform: ios
      profile: ci
  ios_repack:
    name: ios current bundle on verified native runtime
    type: repack
    environment: development
    env:
      APP_VARIANT: preview
      DAYOVA_CI_VALIDATION: 'true'
      EXPO_NO_DOTENV: '1'
    needs:
      - ios_get_build
    if: ${{ needs.ios_get_build.outputs.build_id }}
    params:
      build_id: ${{ needs.ios_get_build.outputs.build_id }}
      embed_bundle_assets: true
  ios_smoke:
    name: ios embedded app smoke
    type: maestro
    environment: development
    after:
      - native_fingerprint
      - ios_build
      - ios_repack
    if: ${{ after.native_fingerprint.status == 'success' }}
    env:
      MAESTRO_APP_ID: de.dayova.app-dev
    params:
      build_id: ${{ after.ios_repack.outputs.build_id || after.ios_build.outputs.build_id }}
      flow_path:
        - .maestro/ci/unauthenticated.yaml
        - .maestro/ci/authenticated.yaml
      maestro_version: 2.10.0
      retries: 0
      output_format: junit
  authenticated_smoke:
    name: Clerk and deployed Convex smoke
    type: custom
    runs_on: linux-medium
    environment: development
    needs:
      - quality
    if: ${{ needs.quality.outputs.native_required == 'true' }}
    steps:
      - uses: eas/checkout
      - name: Verify real authentication and rejected anonymous access
        run: node scripts/auth-smoke.mjs
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: authenticated-smoke-results
          path: .maestro/artifacts/ci/auth-smoke.json
