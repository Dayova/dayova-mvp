name: Continuous Integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: "24.18.0"
    pnpm: "11.15.1"

jobs:
  production_fingerprint:
    name: Production native fingerprints
    type: fingerprint
    environment: production
    # checks supplies the contributor trust gate; production inputs stay off forks.
    needs:
      - checks
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id) }}

  checks:
    name: Lint, typecheck, and test
    type: custom
    runs_on: linux-medium
    # One gate for trusted PRs, manual checks, and the merged main commit.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && contains('OWNER,MEMBER,COLLABORATOR', github.event.pull_request.author_association)) }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run tests
        env:
          EAS_BUILD: "false"
        run: pnpm test

  ota_checks:
    name: Production OTA gates
    type: custom
    runs_on: linux-medium
    needs:
      - checks
      - production_fingerprint
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id && github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id) }}
    environment: production
    env:
      APP_VARIANT: production
      EAS_BUILD_PLATFORM: ios
      OTA_ANDROID_FINGERPRINT: ${{ needs.production_fingerprint.outputs.android_fingerprint_hash }}
      OTA_IOS_FINGERPRINT: ${{ needs.production_fingerprint.outputs.ios_fingerprint_hash }}
    outputs:
      ota_safe: ${{ steps.ota_guard.outputs.ota_safe }}
      ota_reason: ${{ steps.ota_guard.outputs.ota_reason }}
      ota_baseline: ${{ steps.ota_guard.outputs.ota_baseline }}
      ota_current_fingerprints: ${{ steps.ota_guard.outputs.ota_current_fingerprints }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Verify iOS production export
        run: pnpm exec expo export --platform ios --output-dir dist/ios
      - name: Verify Android production export
        env:
          EAS_BUILD_PLATFORM: android
        run: pnpm exec expo export --platform android --output-dir dist/android
      - id: ota_guard
        name: Check OTA safety against distributed binaries
        run: |
          if ota_report="$(node scripts/ota-safety.mjs --json)"; then
            ota_safe=true
          else
            ota_safe=false
          fi

          printf '%s\n' "$ota_report"
          ota_reason="$(OTA_REPORT="$ota_report" node -p 'JSON.parse(process.env.OTA_REPORT).reason')"
          ota_baseline="$(OTA_REPORT="$ota_report" node -p 'JSON.parse(process.env.OTA_REPORT).baseline')"
          ota_current_fingerprints="$(OTA_REPORT="$ota_report" node -p 'JSON.parse(process.env.OTA_REPORT).currentFingerprints')"

          set-output ota_safe "$ota_safe"
          set-output ota_reason "$ota_reason"
          set-output ota_baseline "$ota_baseline"
          set-output ota_current_fingerprints "$ota_current_fingerprints"

          # Native incompatibility is advisory on PRs; an incomplete check is not.
          ota_failure_kind="$(OTA_REPORT="$ota_report" node -p 'JSON.parse(process.env.OTA_REPORT).failureKind')"
          set-output ota_failure_kind "$ota_failure_kind"
      - name: Require a completed PR OTA assessment
        if: ${{ github.event_name == 'pull_request' }}
        run: test "${{ steps.ota_guard.outputs.ota_failure_kind }}" != "preflight"

  pr_ota_report:
    name: PR OTA compatibility report
    type: doc
    after:
      - production_fingerprint
      - ota_checks
    if: ${{ github.event_name == 'pull_request' }}
    params:
      md: |
        ## PR OTA compatibility

        **Source repository:** ${{ github.event.pull_request.head.repo.full_name || 'Unavailable' }}
        **Target repository:** ${{ github.event.pull_request.base.repo.full_name || 'Unavailable' }}

        **OTA-compatible:** ${{ after.ota_checks.status == 'success' && after.ota_checks.outputs.ota_safe || 'Not confirmed' }}

        **Reason:** ${{ after.ota_checks.outputs.ota_reason || 'Assessment did not complete. Inspect the fingerprint and OTA jobs. Production checks run only for trusted, same-repository PRs after quality checks pass.' }}

        **Fingerprint job:** ${{ after.production_fingerprint.status }}
        **OTA/export job:** ${{ after.ota_checks.status }}
        **Distributed baseline:** ${{ after.ota_checks.outputs.ota_baseline || 'Not assessed' }}
        **Current fingerprints:** ${{ after.ota_checks.outputs.ota_current_fingerprints || 'Not assessed' }}

        A false result means this source cannot ship to the recorded binaries via OTA.
        Native changes may still merge, but need a verified native release or an
        independently reviewed compatibility record before OTA can resume.
        A failed or skipped assessment is not evidence of OTA compatibility.

        This report is advisory and publishes nothing. Main rechecks the merged
        source and blocks publication unless compatibility is confirmed.

  deploy_convex:
    name: Deploy Convex
    type: custom
    runs_on: linux-medium
    needs:
      - checks
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Deploy Convex
        run: pnpm convex deploy --typecheck enable

  send_updates:
    name: Send updates
    type: custom
    runs_on: linux-medium
    needs:
      - ota_checks
      - production_fingerprint
      - deploy_convex
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && needs.ota_checks.outputs.ota_safe == 'true' }}
    environment: production
    env:
      APP_VARIANT: production
      OTA_SOURCE_SHA: ${{ github.sha }}
      OTA_ANDROID_FINGERPRINT: ${{ needs.production_fingerprint.outputs.android_fingerprint_hash }}
      OTA_IOS_FINGERPRINT: ${{ needs.production_fingerprint.outputs.ios_fingerprint_hash }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Verify production manifest and distributed-binary compatibility
        run: node scripts/ota-safety.mjs
      - name: Export and publish both production platforms
        run: node scripts/publish-production-ota.mjs

  ota_skipped:
    name: OTA update skipped
    type: doc
    needs:
      - ota_checks
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && needs.ota_checks.outputs.ota_safe != 'true' }}
    params:
      md: |
        ## OTA update skipped

        The production OTA update was not sent.

        **Reason:** ${{ needs.ota_checks.outputs.ota_reason }}

        **Distributed baseline:** ${{ needs.ota_checks.outputs.ota_baseline }}

        **Current fingerprints:** ${{ needs.ota_checks.outputs.ota_current_fingerprints }}

        This block persists across later commits until the production manifest and native fingerprints match verified distributed binaries.
