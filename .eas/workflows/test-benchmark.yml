name: Test quality benchmark

on:
  workflow_dispatch:
    inputs:
      jest_workers:
        type: choice
        default: "1"
        options: ["1", "2"]

defaults:
  tools:
    node: "24.18.0"
    pnpm: "11.15.1"

jobs:
  benchmark:
    name: Measure lint, typecheck, and tests
    type: custom
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Measure quality checks
        env:
          EAS_BUILD: "false"
          CI_JEST_WORKERS: ${{ inputs.jest_workers || '1' }}
        run: node scripts/benchmark-checks.mjs
