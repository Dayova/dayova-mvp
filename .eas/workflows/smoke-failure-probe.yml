name: Deliberate device smoke failure probe

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        options: [android, ios]
      build_id:
        type: string
        required: true

jobs:
  probe:
    type: maestro
    environment: development
    runs_on: ${{ inputs.platform == 'android' && 'linux-medium-nested-virtualization' || 'macos-medium' }}
    env:
      MAESTRO_APP_ID: ${{ inputs.platform == 'android' && 'com.dayova.dev' || 'de.dayova.app-dev' }}
    hooks:
      after_maestro_tests:
        - if: ${{ always() }}
          run: node scripts/ci-sanitize-maestro.mjs
    params:
      build_id: ${{ inputs.build_id }}
      flow_path: .maestro/ci/failure-probe.yaml
      maestro_version: 2.10.0
      retries: 0
      output_format: junit
