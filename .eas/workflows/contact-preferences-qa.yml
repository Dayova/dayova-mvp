name: Contact preferences native acceptance
on:
  workflow_dispatch:
    inputs:
      platform:
        type: string
        default: ios
      ios_build_id:
        type: string
        default: 37a35dd1-f71a-45f4-82b3-6d066d49be77
      android_build_id:
        type: string
        default: 7415c48a-fd27-4f9d-9cf3-8616758a51b4
concurrency:
  cancel_in_progress: false
  group: contact-acceptance-${{ github.ref }}-${{ inputs.platform }}
defaults:
  tools:
    node: '24.18.0'
    pnpm: '11.15.1'
jobs:
  ios:
    name: iOS contact acceptance
    type: custom
    runs_on: macos-medium
    image: macos-tahoe-26.5-xcode-26.6
    environment: development
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      EXPO_NO_DOTENV: '1'
      MAESTRO_APP_ID: de.dayova.app-dev
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - uses: ./.eas/functions/contact-preferences-qa
        with:
          platform: ios
          build_id: ${{ inputs.ios_build_id }}
  android:
    name: Android contact acceptance
    type: custom
    runs_on: linux-medium-nested-virtualization
    environment: development
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      EXPO_NO_DOTENV: '1'
      MAESTRO_APP_ID: com.dayova.dev
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - uses: ./.eas/functions/contact-preferences-qa
        with:
          platform: android
          build_id: ${{ inputs.android_build_id }}
