name: Contact acceptance against an ephemeral local backend
inputs:
  - name: platform
    required: true
    allowed_values: [android, ios]
  - name: build_id
    required: true
runs:
  steps:
    - uses: eas/download_build
      id: app
      with:
        build_id: ${{ inputs.build_id }}
    - uses: eas/install_maestro
      with:
        maestro_version: 2.10.0
        backend: maestro
    - uses: eas/start_android_emulator
      if: ${{ success() && inputs.platform == 'android' }}
    - name: Enable software keyboard on the disposable iOS worker
      if: ${{ success() && inputs.platform == 'ios' }}
      run: |
        node --input-type=module <<'NODE'
        import { spawnSync } from 'node:child_process';
        if (process.platform !== 'darwin' || !process.env.EAS_BUILD_ID) {
          throw new Error('Keyboard setup is restricted to the disposable EAS iOS worker');
        }
        const run = (name, command, args) => {
          console.log(`Keyboard setup: ${name}`);
          const result = spawnSync(command, args, {
            timeout: 20_000,
            killSignal: 'SIGKILL',
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          if (result.error) throw new Error(`${name}: ${result.error.code}`);
          if (result.status !== 0) {
            throw new Error(`${name}: exit ${result.status}; ${result.stderr.trim()}`);
          }
          return result.stdout.trim();
        };
        // Pinned Xcode 26 uses Simulator.app, before DeviceHub's protected
        // container. Source: appium-ios-simulator 10.9.1, settings.ts.
        const xcode = run('verify Xcode version', 'xcodebuild', ['-version']);
        if (!/^Xcode 26[.]/m.test(xcode)) throw new Error('Keyboard setup requires the pinned Xcode 26 worker');
        run('disable hardware keyboard', 'defaults', ['write', 'com.apple.iphonesimulator', 'ConnectHardwareKeyboard', '-bool', 'NO']);
        const configured = run('verify software-keyboard preference', 'defaults', ['read', 'com.apple.iphonesimulator', 'ConnectHardwareKeyboard']);
        if (configured !== '0') throw new Error('Simulator hardware keyboard remains enabled');
        NODE
    - uses: eas/start_ios_simulator
      if: ${{ success() && inputs.platform == 'ios' }}
      with:
        enable_accessibility_settings: true
    - name: Prepare the simulator's first software-keyboard use
      if: ${{ success() && inputs.platform == 'ios' }}
      run: xcrun simctl spawn booted defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -int 1
    - name: Exercise current JS and isolated consent persistence
      run: node scripts/native-qa/contact-preferences-qa.mjs "${{ steps.app.outputs.artifact_path }}"
    - uses: eas/upload_artifact
      if: ${{ always() }}
      with:
        type: other
        name: contact-acceptance-results
        path: .maestro/artifacts/contact-qa/public
