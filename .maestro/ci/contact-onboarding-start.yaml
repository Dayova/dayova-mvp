appId: ${MAESTRO_APP_ID}
name: Reach the optional contact step through real onboarding
---
- runFlow:
    file: ../shared/launch-unauthenticated.yaml
    env:
      APP_ID: ${MAESTRO_APP_ID}
- tapOn: Registrierung
- extendedWaitUntil:
    visible: 'Schluss mit Aufschieben\.'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Lernzeiten festlegen\.'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Schulmaterial hochladen\.'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Lernplan erstellen lassen\.'
    timeout: 30000
- scrollUntilVisible:
    element: Meinen Start personalisieren
    direction: DOWN
- tapOn: Meinen Start personalisieren
- extendedWaitUntil:
    visible: 'Wie dürfen wir dich nennen\?'
    timeout: 30000
- tapOn:
    id: onboarding-name-input
- inputText: Maestro
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: 'Wie dürfen wir dich nennen\?'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Wie lange möchtest du pro Lerntag einplanen\?'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Du brauchst nicht stundenlang zu lernen\.'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'An welchen Tagen kannst du lernen\?'
    timeout: 30000
- tapOn: Montag
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Du lernst, wenn es dir passt!'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Um wie viel Uhr möchtest du starten\?'
    timeout: 30000
- scrollUntilVisible:
    element: Startzeit auswählen
    direction: DOWN
- tapOn: Startzeit auswählen
- tapOn: Zeit übernehmen
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Deine Lernzeiten'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Welche Klassenstufe besuchst du\?'
    timeout: 30000
- scrollUntilVisible:
    element: Klassenstufe auswählen
    direction: DOWN
- tapOn: Klassenstufe auswählen
- scrollUntilVisible:
    element: '10\. Klasse'
    direction: DOWN
- tapOn: '10\. Klasse'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'In welchem Bundesland gehst du zur Schule\?'
    timeout: 30000
- scrollUntilVisible:
    element: Bundesland auswählen
    direction: DOWN
- tapOn: Bundesland auswählen
- scrollUntilVisible:
    element: 'Berlin'
    direction: DOWN
- tapOn: 'Berlin'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Welche Schulart besuchst du\?'
    timeout: 30000
- scrollUntilVisible:
    element: Schulart auswählen
    direction: DOWN
- tapOn: Schulart auswählen
- scrollUntilVisible:
    element: 'Gymnasium'
    direction: DOWN
- tapOn: 'Gymnasium'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- extendedWaitUntil:
    visible: 'Gestalte Dayova mit uns\.'
    timeout: 30000
- assertVisible: 'Gestalte Dayova mit uns\.'
