    direction: DOWN
- tapOn: '10\. Klasse'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- scrollUntilVisible:
    element: Bundesland auswählen
    direction: DOWN
- tapOn: Bundesland auswählen
- scrollUntilVisible:
    element: 'Berlin'
    direction: DOWN
- tapOn: 'Berlin'
