    env:
      APP_ID: ${MAESTRO_APP_ID}
- tapOn: Registrierung
- extendedWaitUntil:
    visible: 'Schluss mit Aufschieben\.'
    timeout: 30000
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- scrollUntilVisible:
    element: Meinen Start personalisieren
    direction: DOWN
- tapOn: Meinen Start personalisieren
- tapOn:
    id: onboarding-name-input
- inputText: Maestro
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: 'Wie dürfen wir dich nennen\?'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
- tapOn: Weiter
