appId: ${MAESTRO_APP_ID}
name: Changing the number clears feedback and permits a separate news choice
---
- scrollUntilVisible:
    element:
      id: contact-phone-input
    direction: UP
- tapOn:
    id: contact-phone-input
- eraseText: 80
- inputText: '+12015550100'
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: Kontakt mit Dayova
- scrollUntilVisible:
    element: Ohne Kontaktauswahl übernehmen wir diese Nummer nicht.
    direction: DOWN
- assertVisible: Ohne Kontaktauswahl übernehmen wir diese Nummer nicht.
- tapOn: 'Ich möchte per WhatsApp Neuigkeiten zu Dayova erhalten\.'
- scrollUntilVisible:
    element: Auswahl speichern
    direction: DOWN
- tapOn: Auswahl speichern
- extendedWaitUntil:
    visible: Deine Kontaktauswahl wurde gespeichert.
    timeout: 30000
- runFlow: ../shared/relaunch-development.yaml
- scrollUntilVisible:
    element:
      id: contact-phone-input
    direction: UP
- assertVisible: '\+12015550100'
- takeScreenshot: settings-news-persisted
