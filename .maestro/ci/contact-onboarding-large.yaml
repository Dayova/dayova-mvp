appId: ${MAESTRO_APP_ID}
name: Enlarged dark contact remains skippable
---
- runFlow: contact-onboarding-start.yaml
- takeScreenshot: onboarding-large-dark-top
# An accessibility-sized purpose row can exceed the available viewport.
# Capture its scrolled sections instead of requiring 100% simultaneous visibility.
- scrollUntilVisible:
    element:
      id: contact-phone-input
    direction: DOWN
- takeScreenshot: onboarding-large-dark-phone
- scrollUntilVisible:
    element: 'Das Dayova-Team darf mich per WhatsApp zu Feedbackgesprächen einladen und für diese Gespräche anrufen\.'
    direction: DOWN
    visibilityPercentage: 30
    speed: 20
- takeScreenshot: onboarding-large-dark-feedback
- scrollUntilVisible:
    element: 'Ich möchte per WhatsApp Neuigkeiten zu Dayova erhalten\.'
    direction: DOWN
    visibilityPercentage: 30
    speed: 20
- takeScreenshot: onboarding-large-dark-purposes
- scrollUntilVisible:
    element: Jetzt überspringen
    direction: DOWN
- takeScreenshot: onboarding-large-dark-actions
- tapOn: Jetzt überspringen
- assertVisible: 'Wie lautet deine E-Mail-Adresse\?'
