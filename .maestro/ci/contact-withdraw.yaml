appId: ${MAESTRO_APP_ID}
name: Enlarged dark settings support withdrawal and discard unconsented numbers
---
- runFlow: ../shared/relaunch-development.yaml
- takeScreenshot: settings-large-dark-top
- scrollUntilVisible:
    element: 'Ich möchte per WhatsApp Neuigkeiten zu Dayova erhalten\.'
    direction: DOWN
- takeScreenshot: settings-large-dark-purposes
- scrollUntilVisible:
    element: Alle Kontaktfreigaben widerrufen
    direction: DOWN
- takeScreenshot: settings-large-dark-actions
- tapOn: Alle Kontaktfreigaben widerrufen
- extendedWaitUntil:
    visible: Deine Kontaktauswahl wurde gespeichert.
    timeout: 30000
- runFlow: ../shared/relaunch-development.yaml
- scrollUntilVisible:
    element:
      id: contact-phone-input
    # Relaunch starts at the top. With iOS accessibility text, the introductory
    # copy fills the viewport and the phone input is below it.
    direction: DOWN
- assertNotVisible: '\+12015550100'
- assertNotVisible: '\+4915123456789'
- tapOn:
    id: contact-phone-input
- inputText: '015123456789'
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: Kontakt mit Dayova
- scrollUntilVisible:
    element: Ohne Kontaktauswahl übernehmen wir diese Nummer nicht.
    direction: DOWN
- assertVisible: Ohne Kontaktauswahl übernehmen wir diese Nummer nicht.
- scrollUntilVisible:
    element: Auswahl speichern
    direction: DOWN
- tapOn: Auswahl speichern
- extendedWaitUntil:
    visible: Deine Kontaktauswahl wurde gespeichert.
    timeout: 30000
- scrollUntilVisible:
    element:
      id: contact-phone-input
    direction: UP
- assertNotVisible: '015123456789'
- takeScreenshot: settings-withdrawal-persisted
