appId: ${APP_ID}
---
# Fail before clearing data if someone supplies a production app ID.
- assertTrue: ${ APP_ID == 'com.dayova.dev' || APP_ID == 'de.dayova.app-dev' }
# Use a disposable emulator/simulator: clearKeychain clears the entire iOS Keychain.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
# Optional local dev-client bootstrap; this loads the root, not a login deep link.
- runFlow:
    when:
      true: ${typeof DEV_SERVER_URL != 'undefined' && DEV_SERVER_URL != ''}
    commands:
      - extendedWaitUntil:
          visible: Development Build
          timeout: 60000
      - openLink:
          # SDK 58's launch contract disables developer onboarding and overlays.
          link: >-
            ${'exp+dayova://?__expo_url=' + encodeURIComponent(DEV_SERVER_URL) +
            '&__expo_disable_onboarding=1&__expo_disable_fab=1&__expo_disable_auto_launch=1'}
      # iOS can require confirmation on the first custom-scheme launch.
      - runFlow:
          when:
            visible: 'Open in .Dayova.\?'
          commands:
            - tapOn: Open
      - extendedWaitUntil:
          # At accessibility text sizes the welcome actions are below the fold.
          # The brand button identifies the rendered app without needing scroll.
          visible: "Login|Reload|Dayova, App-Informationen"
          # A fresh development bundle can consume the first minute on a cloud
          # iOS worker. Wait for the rendered app after compilation as well.
          timeout: 180000
      # Dismiss a developer menu if the client still presents one.
      # Android dismisses this modal with Back; iOS exposes a Close control.
      - runFlow:
          when:
            visible: Reload
          commands:
            - runFlow:
                when:
                  platform: iOS
                commands:
                  - tapOn: Close
            - runFlow:
                when:
                  platform: Android
                commands:
                  - back
- runFlow: dismiss-development-notices.yaml
- scrollUntilVisible:
    element:
      text: Login
      enabled: true
    direction: DOWN
    timeout: 60000
- assertVisible: Registrierung
# The welcome controls become accessible before their entrance animation settles.
- waitForAnimationToEnd:
    timeout: 5000
