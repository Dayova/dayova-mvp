appId: ${APP_ID}
---
# Fail before clearing data if someone supplies a production app ID.
- assertTrue: ${ APP_ID == 'com.dayova.dev' || APP_ID == 'de.dayova.app-dev' }
# Use a disposable emulator/simulator: clearKeychain clears the entire iOS Keychain.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
# Optional local dev-client bootstrap; this loads the root, not a login deep link.
- runFlow:
    when:
      true: ${typeof DEV_SERVER_URL != 'undefined' && DEV_SERVER_URL != ''}
    commands:
      - extendedWaitUntil:
          visible: Development Build
          timeout: 60000
      - openLink:
          # SDK 58's launch contract disables developer onboarding and overlays.
          link: >-
            ${'exp+dayova://?__expo_url=' + encodeURIComponent(DEV_SERVER_URL) +
            '&__expo_disable_onboarding=1&__expo_disable_fab=1&__expo_disable_auto_launch=1'}
      # iOS can require confirmation on the first custom-scheme launch.
      - runFlow:
          when:
            visible: 'Open in .Dayova.\?'
          commands:
            - tapOn: Open
      - extendedWaitUntil:
          visible: "Login|Reload"
          # A fresh development bundle can consume the first minute on a cloud
          # iOS worker. Wait for the rendered app after compilation as well.
          timeout: 180000
      # Dismiss a developer menu if the client still presents one.
      # Android dismisses this modal with Back; iOS exposes a Close control.
      - runFlow:
          when:
            visible: Reload
          commands:
            - runFlow:
                when:
                  platform: iOS
                commands:
                  - tapOn: Close
            - runFlow:
                when:
                  platform: Android
                commands:
                  - back
- extendedWaitUntil:
    visible:
      text: Login
      enabled: true
    timeout: 60000
- assertVisible: Registrierung
# Disabling analytics intentionally produces this SDK warning in development.
# Its LogBox banner can cover bottom actions. Dismiss only this exact warning;
# iOS can prefix the accessibility label with "!, ". No other warning is matched.
- runFlow:
    when:
      true: ${typeof DEV_SERVER_URL != 'undefined' && DEV_SERVER_URL != ''}
      visible: "(?s)(!, )?You must pass your PostHog project's api key[.]\\s*The client will be disabled[.]"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn:
                containsChild:
                  text: "(?s)(!, )?You must pass your PostHog project's api key[.]\\s*The client will be disabled[.]"
                # Close this notification directly; the Android SDK 58 LogBox
                # details screen can be blank. The close control is at its end.
                point: "99%,50%"
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow:
                when:
                  notVisible: Dismiss
                commands:
                  - tapOn: "(?s)(!, )?You must pass your PostHog project's api key[.]\\s*The client will be disabled[.]"
            - assertVisible: Dismiss
            # Keep the hit inside the label's upper area, above the safe area.
            - tapOn:
                text: Dismiss
                point: "50%,10%"
      - assertNotVisible: "(?s)(!, )?You must pass your PostHog project's api key[.]\\s*The client will be disabled[.]"
# The welcome controls become accessible before their entrance animation settles.
- waitForAnimationToEnd:
    timeout: 5000
