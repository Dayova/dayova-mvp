appId: ${APP_ID}
name: Password recovery validates email and returns to login
tags:
  - smoke
  - auth
---
- runFlow: ../shared/open-login.yaml
# An invalid address exercises prefill and local validation without sending mail.
- tapOn: E-Mail-Adresse
- inputText: invalid-email
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: Willkommen
- scrollUntilVisible:
    element: Passwort vergessen
    direction: DOWN
    timeout: 10000
- tapOn: Passwort vergessen
- assertVisible: 'Passwort vergessen\?'
- assertVisible: invalid-email
- scrollUntilVisible:
    element: CODE SENDEN
    direction: DOWN
    timeout: 10000
- tapOn: CODE SENDEN
- assertVisible: 'Bitte gib eine gültige E-Mail-Adresse ein\.'
- scrollUntilVisible:
    element: E-Mail-Adresse
    direction: UP
    timeout: 10000
- tapOn: E-Mail-Adresse
- eraseText
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: 'Passwort vergessen\?'
- scrollUntilVisible:
    element: CODE SENDEN
    direction: DOWN
    timeout: 10000
- tapOn: CODE SENDEN
- assertVisible: 'Bitte gib eine gültige E-Mail-Adresse ein\.'
- assertNotVisible: Bestätigungscode
- takeScreenshot: password-recovery-validation
- scrollUntilVisible:
    element: Zurück
    direction: UP
    timeout: 10000
- tapOn: Zurück
- assertVisible: Willkommen
- assertVisible: invalid-email
- assertNotVisible: 'Bitte gib eine gültige E-Mail-Adresse ein\.'
- scrollUntilVisible:
    element: LOGIN
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: LOGIN
    enabled: true
# Reopening must start a fresh recovery form with the original login value.
- tapOn: Passwort vergessen
- assertVisible: 'Passwort vergessen\?'
- assertVisible: invalid-email
- assertNotVisible: 'Bitte gib eine gültige E-Mail-Adresse ein\.'
