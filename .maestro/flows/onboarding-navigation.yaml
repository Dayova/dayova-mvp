appId: ${APP_ID}
name: Registration introduction and profile answers survive back navigation
tags:
  - smoke
  - onboarding
---
- runFlow: ../shared/launch-unauthenticated.yaml
- tapOn: Registrierung
- assertVisible: 'Schluss mit Aufschieben\.'
- tapOn: Weiter
- assertVisible: 'Lernzeiten festlegen\.'
- tapOn: Weiter
- assertVisible: 'Schulmaterial hochladen\.'
- tapOn: Weiter
- assertVisible: 'Lernplan erstellen lassen\.'
- tapOn: Meinen Start personalisieren
- assertVisible: 'Wie dürfen wir dich nennen\?'
- assertVisible:
    text: Weiter
    enabled: false
- tapOn:
    id: onboarding-name-input
- inputText: A
# Dismiss on both platforms before the footer moves with the keyboard.
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: 'Wie dürfen wir dich nennen\?'
- assertVisible: 'Bitte gib deinen Namen ein\.'
- assertVisible:
    text: Weiter
    enabled: false
- tapOn:
    id: onboarding-name-input
- eraseText
- inputText: Maestro
- runFlow:
    file: ../shared/dismiss-auth-keyboard.yaml
    env:
      AUTH_HEADING: 'Wie dürfen wir dich nennen\?'
- assertNotVisible: 'Bitte gib deinen Namen ein\.'
- assertVisible:
    text: Weiter
    enabled: true
- tapOn: Weiter
- assertVisible: 'Wie lange möchtest du pro Lerntag einplanen\?'
# Continue explicitly confirms the displayed default.
- assertVisible:
    text: Weiter
    enabled: true
- tapOn: Zurück
- assertVisible: 'Wie dürfen wir dich nennen\?'
- assertVisible: Maestro
- tapOn: Weiter
- assertVisible: 'Wie lange möchtest du pro Lerntag einplanen\?'
- assertNotVisible: 30 Minuten auswählen
- assertVisible:
    text: Weiter
    enabled: true
- tapOn: Weiter
- assertVisible: 'Du brauchst nicht stundenlang zu lernen\.'
# Informational steps place their action inside the scrollable content on short screens.
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
    timeout: 10000
- tapOn: Weiter
- assertVisible: 'An welchen Tagen kannst du lernen\?'
- assertVisible:
    text: Weiter
    enabled: false
- tapOn: Montag
- assertVisible:
    text: Weiter
    enabled: true
- tapOn: Montag
- assertVisible:
    text: Weiter
    enabled: false
- tapOn: Montag
- tapOn: Weiter
- assertVisible: 'Du lernst, wenn es dir passt!'
- scrollUntilVisible:
    element: Weiter
    direction: DOWN
    timeout: 10000
- tapOn: Weiter
- assertVisible: 'Um wie viel Uhr möchtest du starten\?'
- assertVisible: Startzeit auswählen
- tapOn: Zurück
- assertVisible: 'Du lernst, wenn es dir passt!'
- tapOn: Zurück
- assertVisible: 'An welchen Tagen kannst du lernen\?'
- assertVisible:
    text: Weiter
    enabled: true
# Toggling the retained day off must disable progress again.
- tapOn: Montag
- assertVisible:
    text: Weiter
    enabled: false
- takeScreenshot: onboarding-retained-answers
