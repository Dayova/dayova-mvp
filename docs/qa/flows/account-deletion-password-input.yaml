# Precondition: disposable QA account, account-deletion confirmation already open.
# This probe never submits deletion and never uses a real password.
appId: ${APP_ID}
---
- tapOn: Aktuelles Passwort zur Bestätigung
- inputText: QA-input-probe
- takeScreenshot: deletion-input-probe
- assertVisible:
    text: Konto löschen
    enabled: true
- eraseText: 30
- assertVisible:
    text: Konto löschen
    enabled: false
