appId: com.dayova.dev
name: Android Pixel 9 profile and account flow
---
- assertVisible: "Registrierung"
- startRecording: "android-pixel9-profile-account"
- tapOn: "Registrierung"
- assertVisible: "Du weißt, was heute wirklich zählt."
- tapOn: "Weiter"
- assertVisible: "Deine Prüfung. Alles an einem Ort."
- tapOn: "Weiter"
- assertVisible: "Aus Stoff wird ein klarer Weg."
- tapOn: "Meinen Start personalisieren"

- assertVisible: "Wie dürfen wir dich nennen?"
- takeScreenshot: "01-name-empty"
- tapOn: "Dein Name"
- inputText: "Matrix Test"
- hideKeyboard
- tapOn: "Weiter"

- assertVisible: "Wie lange möchtest du pro Lerntag einplanen?"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "02-study-duration-empty"
- swipe:
    start: 80%, 70%
    end: 20%, 70%
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    start: 80%, 70%
    end: 20%, 70%
    duration: 700
- assertVisible: "90"
- takeScreenshot: "02-study-duration-selected"
- tapOn: "Weiter"

- assertVisible: "Dein Lernplan braucht echte Zeitfenster."
- takeScreenshot: "03-study-duration-fact"
- tapOn: "Weiter"

- assertVisible: "An welchen Tagen kannst du lernen?"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Montag"
    retryTapIfNoChange: true
- assertVisible:
    text: "Montag"
    checked: true
- takeScreenshot: "04-study-days-selected"
- tapOn: "Weiter"

- assertVisible: "Wann möchtest du an diesen Tagen starten?"
- tapOn: "Startzeit auswählen"
- assertVisible: "Zeit übernehmen"
- tapOn: "Zeit übernehmen"
- assertVisible: "16:00 Uhr"
- takeScreenshot: "05-learning-time-selected"
- tapOn: "Weiter"

- assertVisible: ".*Lernzeiten sind vorbereitet.*"
- takeScreenshot: "06-learning-times-payoff"
- tapOn: "Weiter"

- assertVisible: "Welche Klassenstufe besuchst du?"
- tapOn: "Klassenstufe auswählen"
- tapOn: "9. Klasse"
- assertVisible: "9. Klasse"
- takeScreenshot: "07-grade-selected"
- tapOn: "Weiter"

- assertVisible: "In welchem Bundesland gehst du zur Schule?"
- tapOn: "Bundesland auswählen"
- tapOn: "Sachsen"
- assertVisible: "Sachsen"
- takeScreenshot: "08-state-selected"
- tapOn: "Weiter"

- assertVisible: "Welche Schulart besuchst du?"
- tapOn: "Schulart auswählen"
- tapOn: "Gymnasium"
- assertVisible: "Gymnasium"
- takeScreenshot: "09-school-type-selected"
- tapOn: "Weiter"

- assertVisible: "In welchem Jahr bist du geboren?"
- tapOn: "Geburtsjahr auswählen"
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    start: 50%, 78%
    end: 50%, 52%
    duration: 800
- swipe:
    start: 50%, 78%
    end: 50%, 52%
    duration: 800
- swipe:
    start: 50%, 78%
    end: 50%, 52%
    duration: 800
- tapOn: "2014"
- assertVisible: "2014"
- takeScreenshot: "10-birth-year-selected"
- tapOn: "Weiter"

- assertVisible: "In welchem Monat bist du geboren?"
- tapOn: "Geburtsmonat auswählen"
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    start: 50%, 78%
    end: 50%, 52%
    duration: 800
- tapOn: "September"
- assertVisible: "September"
- takeScreenshot: "11-birth-month-selected"
- tapOn: "Weiter"

- assertVisible: "An welchem Tag bist du geboren?"
- tapOn: "Geburtstag auswählen"
- waitForAnimationToEnd:
    timeout: 5000
- swipe:
    start: 50%, 78%
    end: 50%, 52%
    duration: 800
- tapOn:
    text: "^9\\.$"
- assertVisible:
    text: "^9\\.$"
- takeScreenshot: "12-birth-day-selected"
- tapOn: "Weiter"

- assertVisible: "Wie lautet deine E-Mail-Adresse?"
- tapOn: "name@beispiel.de"
- inputText: "matrix.day292.profile@example.com"
- hideKeyboard
- takeScreenshot: "13-email-filled"
- tapOn: "Weiter"

- assertVisible: "Lege dein Passwort fest."
- takeScreenshot: "14-password-empty"
- stopRecording
