      text: "Weiter"
    direction: DOWN
    timeout: 50000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "An welchem Tag bist du geboren?"
    timeout: 30000
- scrollUntilVisible:
