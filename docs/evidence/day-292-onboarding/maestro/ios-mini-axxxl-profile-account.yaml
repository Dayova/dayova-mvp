appId: de.dayova.app-dev
name: iPhone 13 mini light AXXXL profile and account flow
---
- stopApp
- openLink: "exp+dayova://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible: "Dayova"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Registrierung"
    direction: DOWN
    timeout: 30000
    speed: 50
- tapOn: "Registrierung"

- extendedWaitUntil:
    visible: "Du weißt, was heute wirklich zählt."
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 40000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "Deine Prüfung. Alles an einem Ort."
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 40000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "Aus Stoff wird ein klarer Weg."
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Meinen Start personalisieren"
    direction: DOWN
    timeout: 40000
    speed: 50
- tapOn: "Meinen Start personalisieren"

- extendedWaitUntil:
    visible: "Wie dürfen wir dich nennen?"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Dein Name"
    direction: DOWN
    timeout: 40000
    speed: 50
- takeScreenshot: "01-name-empty"
- tapOn:
    id: "onboarding-name-input"
- inputText: "Matrix Test"
- assertVisible: "Matrix Test"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 40000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "Wie lange möchtest du pro Lerntag einplanen?"
    timeout: 30000
- takeScreenshot: "02-study-duration-empty"
- scrollUntilVisible:
    element:
      text: "30 Minuten auswählen"
    direction: DOWN
    timeout: 50000
    speed: 50
    visibilityPercentage: 20
- tapOn: "30 Minuten auswählen"
- assertVisible: "30 Minuten"
- takeScreenshot: "02-study-duration-selected"
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 40000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "Dein Lernplan braucht echte Zeitfenster."
    timeout: 30000
- takeScreenshot: "03-study-duration-fact"
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 50000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "An welchen Tagen kannst du lernen?"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Montag"
    direction: DOWN
    timeout: 50000
    speed: 50
- tapOn:
    text: "Montag"
    retryTapIfNoChange: true
- takeScreenshot: "04-study-days-selected"
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 50000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "Um wie viel Uhr möchtest du starten?"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*Startzeit auswählen.*"
    direction: DOWN
    timeout: 50000
    speed: 50
    visibilityPercentage: 20
- tapOn: "Startzeit auswählen"
- extendedWaitUntil:
    visible: "Zeit übernehmen"
    timeout: 30000
- tapOn: "Zeit übernehmen"
- extendedWaitUntil:
    notVisible: "Zeit übernehmen"
    timeout: 30000
- takeScreenshot: "05-learning-time-selected"
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 50000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
