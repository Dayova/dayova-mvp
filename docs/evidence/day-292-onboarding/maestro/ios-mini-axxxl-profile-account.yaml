      text: ".*name@beispiel.de.*"
    direction: DOWN
    timeout: 50000
    speed: 50
    visibilityPercentage: 20
- tapOn:
    id: "onboarding-email-input"
- inputText: "matrix.day292.ios-mini-axxxl@example.com"
- assertVisible: "matrix.day292.ios-mini-axxxl@example.com"
- takeScreenshot: "13-email-filled"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Weiter"
    direction: DOWN
    timeout: 40000
    speed: 50
- tapOn: "Weiter"

- extendedWaitUntil:
    visible: "Lege dein Passwort fest."
    timeout: 60000
- scrollUntilVisible:
